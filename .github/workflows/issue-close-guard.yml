name: Issue Close Guard

on:
  issues:
    types: [closed]

jobs:
  verify-tested:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Check if issue was closed via a PR with passing CI
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Allow close with these labels
            const skipLabels = ['tested', 'no-test-required', 'documentation', 'question'];
            if (issue.labels.some(l => skipLabels.includes(l.name))) {
              console.log('Issue has skip label — allowing close.');
              return;
            }

            // Search timeline for merged PRs that reference this issue
            const timeline = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              { owner, repo, issue_number: issue.number }
            );

            const linkedPRs = [];
            for (const event of timeline) {
              if (event.event === 'cross-referenced' && event.source?.issue?.pull_request) {
                try {
                  const pr = await github.rest.pulls.get({
                    owner, repo,
                    pull_number: event.source.issue.number
                  });
                  if (pr.data.merged) linkedPRs.push(pr.data);
                } catch (e) { /* PR in different repo, skip */ }
              }
            }

            if (linkedPRs.length === 0) {
              console.log('No merged PR found. Reopening.');
              await github.rest.issues.update({
                owner, repo,
                issue_number: issue.number,
                state: 'open'
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issue.number,
                body: [
                  '🚫 **Issue reopened — no passing CI found.**',
                  '',
                  'To close this issue:',
                  '1. Create a PR with `fixes #' + issue.number + '` in the description',
                  '2. Ensure CI tests pass',
                  '3. Merge the PR',
                  '',
                  'Or add `tested` (manual verification) or `no-test-required` label.'
                ].join('\n')
              });
              return;
            }

            // Verify latest merged PR had passing checks
            const latestPR = linkedPRs[linkedPRs.length - 1];
            const checks = await github.rest.checks.listForRef({
              owner, repo,
              ref: latestPR.merge_commit_sha
            });

            const hasFailure = checks.data.check_runs.some(
              cr => cr.conclusion === 'failure' || cr.conclusion === 'cancelled'
            );

            if (hasFailure) {
              await github.rest.issues.update({
                owner, repo,
                issue_number: issue.number,
                state: 'open'
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issue.number,
                body: '🚫 **Issue reopened** — PR #' + latestPR.number + ' had failing CI checks. Fix tests and re-merge.'
              });
              return;
            }

            console.log('✓ Closed via PR #' + latestPR.number + ' with passing CI.');
